name: Release

on:
  push:
    branches: [develop]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug npm config
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          echo "--- npm version ---"
          npm --version
          echo "--- .npmrc content ---"
          cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
          cat .npmrc 2>/dev/null || echo "no .npmrc"
          echo "--- NODE_AUTH_TOKEN set? ---"
          if [ -z "${NODE_AUTH_TOKEN}" ]; then echo "NOT SET"; else echo "SET (masked)"; fi
          echo "--- npm whoami ---"
          npm whoami 2>&1 || true

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          unset NODE_AUTH_TOKEN
          echo "--- NODE_AUTH_TOKEN after unset ---"
          if [ -z "${NODE_AUTH_TOKEN}" ]; then echo "NOT SET"; else echo "SET"; fi
          echo "--- Attempting single package publish (types) ---"
          npm publish packages/types --provenance --access public --loglevel verbose 2>&1 || true
          echo "--- Exit code: $? ---"
